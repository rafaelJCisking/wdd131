<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Contact Bahía Accesible Hostal to book your stay or ask about specific accessibility needs.">
    <title>Contact & Book | Bahía Accesible Hostal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">🌊 Bahía Accesible</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="rooms.html">Accessible Rooms</a></li>
                <li><a href="contact.html" class="active">Contact & Book</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Book Your Stay</h1>
        <p>Let us know your specific accessibility requirements so we can prepare the perfect room for your arrival in Viña del Mar.</p>
        
        <form id="booking-form" class="styled-form">
            <label for="guestName">Full Name:</label>
            <input type="text" id="guestName" name="guestName" required>

            <label for="guestEmail">Email Address:</label>
            <input type="email" id="guestEmail" name="guestEmail" required>

            <label for="accessibilityNeeds">Specific Accessibility Needs (e.g., roll-in shower, ground floor):</label>
            <textarea id="accessibilityNeeds" name="accessibilityNeeds" rows="4" required></textarea>

            <button type="submit" class="btn">Submit Inquiry</button>
        </form>
        
        <div id="form-response"></div>
    </main>

    <footer>
        <p>&copy; 2026 Bahía Accesible Hostal, Viña del Mar, Chile.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
