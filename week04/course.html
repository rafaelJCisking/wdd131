<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A college course schedule rendered from a JavaScript object."
    />
    <meta name="author" content="Rafael Valdes" />
    <title>JavaScript Objects | Course Schedule</title>
    <link rel="stylesheet" href="styles/course.css" />
    <script src="scripts/course.js" defer></script>
  </head>
  <body>
    <main>
      <h1>College Course Schedule</h1>
      <table id="sections">
        <caption id="courseName"></caption>
        <thead>
          <tr>
            <th scope="col">Section</th>
            <th scope="col">Enrollment</th>
            <th scope="col">Instructor</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </main>
  </body>
</html>
