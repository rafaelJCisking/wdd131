<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A portrait image gallery demonstrating native lazy loading."
    />
    <meta name="author" content="Rafael Valdes" />
    <title>Lazy Loading Gallery</title>
    <link rel="stylesheet" href="styles/lazyload.css" />
    <script src="scripts/lazyload.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Lazy Loading Gallery</h1>
      <img
        src="images/portrait-01.svg"
        alt="Abstract sunrise over layered hills"
        width="400"
        height="600"
        loading="lazy"
      />
      <img
        src="images/portrait-02.svg"
        alt="Abstract ocean horizon under a bright sky"
        width="400"
        height="600"
        loading="lazy"
      />
      <img
        src="images/portrait-03.svg"
        alt="Abstract desert landscape with a warm sun"
        width="400"
        height="600"
        loading="lazy"
      />
      <img
        src="images/portrait-04.svg"
        alt="Abstract forest with tall green trees"
        width="400"
        height="600"
        loading="lazy"
      />
      <img
        src="images/portrait-05.svg"
        alt="Abstract mountain landscape at twilight"
        width="400"
        height="600"
        loading="lazy"
      />
      <img
        src="images/portrait-06.svg"
        alt="Abstract night sky over a quiet lake"
        width="400"
        height="600"
        loading="lazy"
      />
    </main>
    <footer>
      <p>
        &copy; 2026 Rafael Valdes | Last modified:
        <span id="lastModified"></span>
      </p>
    </footer>
  </body>
</html>
