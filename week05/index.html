<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book of Mormon Chapters</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Book of Mormon: Chapter List</h1>
    
    <!-- El id debe ser exactamente "favchap" (todo minúsculas) -->
    <input type="text" id="favchap" placeholder="Enter a chapter (e.g., Alma 5)">
    
    <!-- Asegúrate de que solo haya UN botón en esta parte del código -->
    <button type="button">Add Chapter</button>
    
    <!-- El id debe ser exactamente "list" -->
    <ul id="list"></ul>

    <!-- Esta línea debe estar justo antes de cerrar el </body> -->
    <script src="script.js"></script>
</body>
</html>
